[project]
name = "mod-workbench"
version = "0.1.0"
description = "Local desktop platform on top of Starfield mod repos."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "watchfiles>=0.21",
    "pyyaml>=6",
    "winotify>=1.1",
    "pillow>=10",
    "claude-agent-sdk==0.2.180",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/support"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
